[project]
name = "comu"
version = "0.0.1"
license = "GPL-3.0-or-later"
authors = [
  { name="Christoph Finkensiep", email="c.finkensiep@uva.nl" }
]
description = "A proof-of-concept library for computational musicology."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-fractions",
    "pitchtypes>=0.4.0",
    "plum>=2.10.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "jupyterlab-code-formatter>=3.1.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260730",
    "pylsp-mypy>=0.8.2",
    "python-lsp-server[all]>=1.15.0",
]

[tool.uv.sources]
pandas-fractions = { git = "https://github.com/Amsterdam-Music-Lab/pandas-fractions" }
